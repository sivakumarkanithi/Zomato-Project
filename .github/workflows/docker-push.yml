name: Build and Push Zomato App to Docker Hub

on:
  push:
    branches: [ "master" ] # This triggers the process whenever you update the master branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step A: Downloads your repository code onto GitHub's cloud runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step B: Log in to Docker Hub using the secrets we saved in Step 2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step C: Automatically builds your Dockerfile and pushes it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sivakumar029/zomato-app:latest
            sivakumar029/zomato-app:${{ github.sha }}
